<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 512px;
        height: 512px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1b1d29" />
          <stop offset="1" stop-color="#0d0e14" />
        </linearGradient>
        <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2e6bff" />
          <stop offset="1" stop-color="#ff4d6a" />
        </linearGradient>
        <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b8dff" />
          <stop offset="0.5" stop-color="#a768ff" />
          <stop offset="1" stop-color="#ff4d6a" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="14" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#ring)" />
      <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)" />

      <g opacity="0.5" stroke="#ffffff" stroke-width="10" stroke-linecap="round">
        <line x1="150" y1="330" x2="210" y2="290" />
        <line x1="130" y1="270" x2="180" y2="240" />
      </g>
      <g opacity="0.4" stroke="#ffffff" stroke-width="10" stroke-linecap="round">
        <line x1="330" y1="200" x2="380" y2="230" />
        <line x1="350" y1="150" x2="390" y2="180" />
      </g>

      <g filter="url(#glow)">
        <path
          d="M300 60 L165 290 L235 290 L205 452 L365 220 L285 220 Z"
          fill="url(#bolt)"
          stroke="#0d0e14"
          stroke-width="10"
          stroke-linejoin="round"
        />
      </g>

      <circle cx="300" cy="60" r="0" />
    </svg>
  </body>
</html>
