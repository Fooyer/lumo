appId: com.lumo.browser
productName: Lumo
copyright: Lumo

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - resources/icon.png
  - package.json

asar: true

# The local speech model (wake word) runs through native onnxruntime binaries, which cannot be loaded from inside the asar.
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/sharp/**
  - node_modules/@img/**

# Lumo runs on the castLabs Electron fork (Widevine DRM). Package that build instead of downloading
# stock Electron; its version string ("+wvcus") isn't plain semver, so it's given explicitly.
electronDist: node_modules/electron/dist
electronVersion: 33.4.11

# The castLabs build must be VMP-signed (EVS) after packaging, or DRM sites reject it (Windows/macOS only).
afterSign: scripts/vmp-sign.js
# Linux: swaps the executable for a launcher that passes the flags Chromium needs there (see the script).
afterPack: scripts/linux-launcher.js

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: x64

linux:
  icon: resources/icon.png
  category: Network
  synopsis: Navegador Lumo
  target:
    - target: AppImage
      arch: x64

appImage:
  artifactName: Lumo-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Lumo-Setup-${version}.${ext}

# Updates come from the GitHub releases of this repository (electron-updater reads latest.yml from them).
publish:
  provider: github
  owner: Fooyer
  repo: lumo
  releaseType: release
